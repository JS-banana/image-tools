name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /image-tools
      NEXT_PUBLIC_TOOLS: ocr
      MODEL_IDS: ppocrv6-tiny
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate code
        run: |
          pnpm test
          pnpm typecheck
          pnpm lint

      - name: Install Python dependencies
        run: pip install pyyaml

      # Pages 仅下载和分发 Tiny；目录生成与文件筛选使用同一组部署选择器。
      - name: Download Tiny model
        env:
          HF_MIRROR: https://huggingface.co
        run: bash scripts/download_models.sh --model ppocrv6-tiny

      - name: Extract Tiny charset
        run: python3 scripts/extract_charset.py --model ppocrv6-tiny

      - name: Build static site
        run: pnpm build

      # Missing files, stale catalogs, bad hashes or missing notices must fail release.
      - name: Verify published model and runtime assets
        run: pnpm check:assets

      - name: Install smoke-test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify OCR in a real Worker under the Pages base path
        run: pnpm test:browser

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
